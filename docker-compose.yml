services:
  avaliador-app:
    image: naxron/avlc_avaliador:latest
    container_name: avlc_avaliador
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - type: bind
        source: ./banco_publico
        target: /app/banco_publico
      - type: bind
        source: ./historico_local_tentativas
        target: /app/historico_local_tentativas
      - type: bind
        source: ./competicao.db
        target: /app/competicao.db
        bind:
          create_host_path: false
    environment:
      - PYTHONUNBUFFERED=1
    shm_size: '2gb'
    pids_limit: 4096
    mem_limit: 3g
